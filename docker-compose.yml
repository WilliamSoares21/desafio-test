services:
  digital-college-db:
    image: mysql:8.4
    container_name: escola-db-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: escola-db
      MYSQL_USER: usul
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - dados-college:/var/lib/mysql
      - ./setup-db.sql:/docker-entrypoint-initdb.d/setup-db.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "usul",
          "-pdevpass",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  escola-api:
    build: .
    image: imagem-escola-api-v1
    container_name: api-digital-college
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      digital-college-db:
        condition: service_healthy

volumes:
  dados-college:
